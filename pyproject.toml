[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scmg"
version = "0.1.0"
description = "Source-Constrained Memory Guard for persistent-memory agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "299195" }]
dependencies = []

[project.scripts]
scmg-bridge = "scmg.bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
